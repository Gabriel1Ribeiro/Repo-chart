<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="metricas.css">
    <title>Document</title>
</head>
<body>

    <div class="div-pai">
        <div class="div-metricas">
            <canvas id="can_metrica_linha"></canvas>
        </div>

        <div class="div-metricas">
            <canvas id="can_metrica_barra"></canvas>
        </div>
    </div>



</body>
</html>

<script>
    var can_metrica_linha = new Chart(document.getElementById('can_metrica_linha').getContext('2d'), {
    type: 'line',
    data: {
        labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
        datasets: [
        {
            label: 'Temperatura',
            data: [30, 29, 28, 25, 22, 23],
            borderColor: '#63B1BC',
            backgroundColor: '#ED145B'
        },
        {
            label: 'Umidade',
            data: [80, 82, 80, 85, 80, 83],
            borderColor: '#63B1BC',
            backgroundColor: '#ED145B'
        }
    ]
    },
    options: {
        scales: {
            x: {
                beginAtZero: true
            },
            y: {
                title: {
                    display: true,
                    text: '(%)'
                },
                beginAtZero: true,
            },
        },
    }
});

var metricaBarra = new Chart(document.getElementById('can_metrica_barra').getContext('2d'), {
    type: 'bar',
    data: {
        labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
        datasets: [
        {
            label: 'Temperatura Média',
            data: [22, 24, 27, 23, 20, 18],
            borderColor: '#63B1BC',
            backgroundColor: '#ED145B'
        },
        {
            label: 'Umidade Média',
            data: [90, 89, 93, 87, 88, 82],
            borderColor: '#63B1BC',
            backgroundColor: '#ED145B'
        }
    ]
    },
    options: {
        scales: {
            x: {
                beginAtZero: true
            },
            y: {
                title: {
                    display: true,
                    text: '(%)'
                },
                beginAtZero: true,
            },
        },
    }
});

</script>
